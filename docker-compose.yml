services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-zapret2:stage1
    container_name: web-zapret2
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SS_LISTEN_PORT:-8388}:8388/tcp"
      - "${SS_LISTEN_PORT:-8388}:8388/udp"
      - "${SOCKS5_LISTEN_PORT:-1080}:1080/tcp"
      - "${SOCKS5_LISTEN_PORT:-1080}:1080/udp"
      - "${PANEL_PORT:-8080}:8080/tcp"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s
    volumes:
      - wz-state:/opt/webzapret/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wz-state: