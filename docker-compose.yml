services:
  gateway:
    container_name: web_zapret2
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 77.88.8.8
      - 8.8.8.8
    image: web-zapret2:stage1
    restart: unless-stopped
    env_file: .env
    networks:
      - s-ui_s-ui
    ports:
      - "${SS_LISTEN_PORT:-8388}:${SS_LISTEN_PORT:-8388}/tcp"
      - "${SS_LISTEN_PORT:-8388}:${SS_LISTEN_PORT:-8388}/udp"
      - "${SOCKS5_LISTEN_PORT:-1080}:${SOCKS5_LISTEN_PORT:-1080}/tcp"
      - "${SOCKS5_LISTEN_PORT:-1080}:${SOCKS5_LISTEN_PORT:-1080}/udp"
      - "${HTTP_LISTEN_PORT:-8888}:${HTTP_LISTEN_PORT:-8888}/tcp"
      - "${PANEL_PORT:-8080}:${PANEL_PORT:-8080}/tcp"
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PANEL_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s
    volumes:
      - wz-state:/opt/webzapret/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wz-state:

networks:
  s-ui_s-ui:
    external: true