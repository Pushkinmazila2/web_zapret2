# tinyproxy HTTP/HTTPS (CONNECT) proxy server — rendered by wz-svc.sh
# Placeholders __HTTP_PORT__ / __AUTH__ are substituted at startup.

User proxy
Group proxy
Port __HTTP_PORT__
Listen 0.0.0.0

Timeout 300
MaxClients 100
DisableViaHeader Yes
LogLevel Info

# Allow connections from any IP (access control disabled = default allow)
# CONNECT method allowed to all ports when ConnectPort is omitted

__AUTH__
