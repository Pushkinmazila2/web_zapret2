# dante (sockd) SOCKS5 server — rendered by entrypoint.sh
# Placeholders __SOCKS5_PORT__ / __WAN_IFACE__ are substituted at startup.

logoutput: /var/log/webzapret/sockd.log

internal: 0.0.0.0 port = __SOCKS5_PORT__
external: __WAN_IFACE__

clientmethod: none
socksmethod: none

user.privileged: root
user.unprivileged: proxy

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: bind connect udpassociate
    log: error
}
